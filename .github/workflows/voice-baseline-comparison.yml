name: Manual browser baseline
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to inspect independently of current release checks
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: browser-baseline-${{ inputs.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      MANUFEO_LOCAL_HTTP_TEST: "1"
      NEXT_PUBLIC_FORGEO_AUTH_BYPASS: "1"
      NEXT_PUBLIC_COMMERCIAL_CLOUD_ENABLED: "0"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_e2e_local_only"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Compare unchanged main browser behavior
        run: npx playwright test --workers=4 --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unchanged-main-browser-results
          path: test-results/
