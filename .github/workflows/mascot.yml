name: Mascot browser checks
on:
  pull_request:
    paths:
      - 'app/manufeo-mascot*'
      - 'app/manufeo-help*'
      - 'app/use-help-voice.ts'
      - 'lib/help-voice-recorder.ts'
      - 'app/quote-suggestions*'
      - 'app/mobile-auto-pdf-preview.tsx'
      - 'lib/quote-suggestions.ts'
      - 'e2e/quote-suggestions.spec.ts'
      - 'app/manufeo-splash.tsx'
      - 'app/action-voice-experience.tsx'
      - 'lib/mascot.ts'
      - 'e2e/mascot.spec.ts'
      - 'playwright.mascot.config.ts'
      - '.github/workflows/mascot.yml'
permissions:
  contents: read
jobs:
  mascot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.mascot.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mascot-browser-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
