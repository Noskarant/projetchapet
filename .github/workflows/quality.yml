name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build browser test app
        run: npm run build
        env:
          NEXT_PUBLIC_FORGEO_AUTH_BYPASS: "1"
          NEXT_PUBLIC_COMMERCIAL_CLOUD_ENABLED: "0"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_e2e_local_only"

      - name: Browser regressions - business profile
        continue-on-error: true
        run: npx playwright test e2e/mobile-business-profile-copilot.spec.ts

      - name: Browser regressions - profitability
        continue-on-error: true
        run: npx playwright test e2e/mobile-profitability.spec.ts

      - name: Browser regressions - full suite
        run: npm run test:e2e

      - name: Build public auth app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_e2e_local_only"

      - name: Browser smoke - public auth without bypass
        run: npx playwright test --config=playwright.public.config.ts

      - name: Setup npm audit client
        run: npm install --global npm@11.19.0 --no-audit --no-fund

      - name: Dependency security audit
        shell: bash
        run: |
          set +e
          output="$(timeout 120s npm audit --omit=dev --audit-level=high 2>&1)"
          status=$?
          set -e

          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if [ "$status" -eq 124 ] || printf '%s\n' "$output" | grep -Eqi '5[0-9][0-9] (Service Unavailable|Internal Server Error|Bad Gateway|Gateway Timeout)|ENOTFOUND|ECONNRESET|ETIMEDOUT|EAI_AGAIN|ECONNREFUSED|socket hang up'; then
            echo "::warning::npm audit indisponible (erreur réseau/service). Les tests restent valides, mais aucun résultat de vulnérabilité n’a pu être obtenu."
            exit 0
          fi

          exit "$status"

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
