name: Philippe voice and PDF regressions
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: philippe-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MANUFEO_LOCAL_HTTP_TEST: "1"
      CI: "1"
      NEXT_PUBLIC_FORGEO_AUTH_BYPASS: "1"
      NEXT_PUBLIC_COMMERCIAL_CLOUD_ENABLED: "0"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_e2e_local_only"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test e2e/philippe-october-5.spec.ts e2e/philippe-october-4.spec.ts e2e/action-voice-quality.spec.ts e2e/philippe-october-3.spec.ts e2e/philippe-quote-preview.spec.ts e2e/mobile-quote-preview-scroll.spec.ts e2e/mobile-long-voice.spec.ts e2e/mobile-unified-quote-sheet.spec.ts e2e/mobile-copilot-dictation.spec.ts e2e/mobile-copilot-painting.spec.ts e2e/quote-suggestions.spec.ts --retries=0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: philippe-regression-results
          path: test-results/
